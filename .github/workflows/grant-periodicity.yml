
name: LNZ Grant Lean Audit

on:
  push:
    branches:
      - audit/grant-periodicity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grant-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check Lean version
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake --version

      - name: Generate Lake manifest
        shell: bash
        run: |
          set -euo pipefail
          lake update
          test -f lake-manifest.json

      - name: Download Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Compile GrantMode3
        shell: bash
        run: |
          set -euo pipefail
          lake build GrantMode3
          lake env lean GrantMode3.lean

      - name: Verify no placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '\b(sorry|admit)\b' GrantMode3.lean; then
            echo "FORBIDDEN_PLACEHOLDER"
            exit 1
          fi
          sha256sum GrantMode3.lean
          echo "GRANT_P0_COMPILED"
